# Configuración de Netlify para sitio estático.
# El "build" no compila nada: solo verifica el presupuesto de rendimiento. Si un
# cambio engorda el CSS, el JS, las fuentes o la imagen del héroe por encima de
# lo acordado, el comando sale con código 1 y el despliegue no se publica.
[build]
  publish = "."
  command = "node scripts/perf-budget.mjs"

# Portal de cliente (SPA React Router). Los assets reales de /portal/assets/* se
# sirven directamente; cualquier otra ruta /portal/* cae a su index.html para que
# el enrutado del lado del cliente funcione en enlaces profundos y recargas.
[[redirects]]
  from = "/portal/*"
  to = "/portal/index.html"
  status = 200

# `publish = "."` sirve TODO lo versionado. El codigo fuente del portal de cliente
# (50 ficheros: src/lib/api.ts, .env.example, vite.config.ts, modelo de roles...)
# quedaba accesible publicamente. Se bloquea el acceso; lo correcto a medio plazo es
# sacar ese proyecto del repositorio de la web.
[[redirects]]
  from = "/portal-cliente/*"
  to = "/404.html"
  status = 404

# Documentos internos de la auditoria: no deben servirse.
[[redirects]]
  from = "/AUDITORIA.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/HALLAZGOS.md"
  to = "/404.html"
  status = 404

# Cabeceras de seguridad para todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "frame-ancestors 'self'"

# Caché larga e inmutable para la imagen del hero (no cambia)
[[headers]]
  for = "/robotPerfecto.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robotPerfecto.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fuentes autoalojadas: el contenido nunca cambia bajo el mismo nombre.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Variantes derivadas del héroe y del logo (AVIF/WebP/JPEG generadas en build).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Caché para el resto de imágenes
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Caché para hojas de estilo
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Caché para scripts
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
